# Validates the app database on every change and publishes it to the gh-pages
# branch from main, served by GitHub Pages and jsDelivr.
name: Database

on:
  pull_request:
    paths: ['database/**', 'crates/apps-database/**']
  push:
    branches: [main]
    paths: ['database/**', 'crates/apps-database/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: database-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:latest
    defaults:
      run:
        shell: bash
        working-directory: ${{ github.event.repository.name }}
    steps:
      - uses: Crown-OS/.github/.github/actions/prepare-workspace@main
        with:
          packages: oxipng
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ github.event.repository.name }}
      - run: cargo test --package crownos-apps-database
      - run: cargo build-index
      - if: github.event_name != 'pull_request'
        run: oxipng -o 4 --strip safe database/dist/v1/icons/*.png
      - if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ github.event.repository.name }}/database/dist
          force_orphan: true
      - if: github.event_name != 'pull_request'
        run: |
          curl -fsS "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@gh-pages/v1/index.bin.zst" ||
            echo "::warning::jsDelivr purge failed; the CDN serves the previous index until its cache expires."
